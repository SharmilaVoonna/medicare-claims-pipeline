name: pipeline-cd

on:
  # Run after the CI workflow finishes on master
  workflow_run:
    workflows: ["pipeline-ci"]
    types: [completed]
    branches: [master]
  # Allow running it manually too
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # allow pushing to GitHub Container Registry

jobs:
  publish-image:
    # Only publish if CI passed (or when run manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/sharmilavoonna/medicare-claims-pipeline:latest
            ghcr.io/sharmilavoonna/medicare-claims-pipeline:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SharmilaVoonna/medicare-claims-pipeline